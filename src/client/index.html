<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bomberman Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a2e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== PAGE D'ACCUEIL ===== */
    #menu-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #menu-screen h1 {
      font-size: 54px;
      color: #f5a623;
      text-shadow: 0 0 15px rgba(245, 166, 35, 0.5);
    }

    .menu-btn {
      padding: 14px 48px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .menu-btn:hover {
      transform: scale(1.05);
    }

    #btn-jouer { background-color: #27ae60; color: white; }
    #btn-quitter { background-color: #c0392b; color: white; }

    /* ===== ÉCRAN DE JEU ===== */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #game-status {
      font-size: 16px;
      color: #f5a623;
    }

    canvas {
      border: 3px solid #f5a623;
      box-shadow: 0 0 15px rgba(245, 166, 35, 0.3);
      background-color: #34495e;
    }

    #controls-hint {
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- ===== PAGE D'ACCUEIL ===== -->
  <div id="menu-screen">
    <h1>Bomberman Arena</h1>
    <button class="menu-btn" id="btn-jouer">JOUER</button>
    <button class="menu-btn" id="btn-quitter">QUITTER</button>
  </div>

  <!-- ===== ÉCRAN DE JEU ===== -->
  <div id="game-screen">
    <div id="game-status">Statut : Test de déplacement</div>
    <canvas id="gameCanvas"></canvas>
    <div id="controls-hint">Utilisez les flèches du clavier pour déplacer le joueur (🔴)</div>
    <button class="menu-btn" id="btn-retour" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; background-color: #7f8c8d;">Retour au menu</button>
  </div>

  <script>
    const MAP_WIDTH = 13;
    const MAP_HEIGHT = 11;
    const TILE_SIZE = 48;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = MAP_WIDTH * TILE_SIZE;
    canvas.height = MAP_HEIGHT * TILE_SIZE;

    // Matrice de test (1 = mur, 0 = vide)
    const map = [];
    for (let y = 0; y < MAP_HEIGHT; y++) {
      const row = [];
      for (let x = 0; x < MAP_WIDTH; x++) {
        if (x % 2 !== 0 && y % 2 !== 0) {
          row.push(1); // Mur
        } else {
          row.push(0); // Vide
        }
      }
      map.push(row);
    }

    let playerPos = { x: 0, y: 0 };

    function movePlayer(currentPos, direction) {
      const newPos = { x: currentPos.x, y: currentPos.y };
      if (direction === 'UP') newPos.y -= 1;
      if (direction === 'DOWN') newPos.y += 1;
      if (direction === 'LEFT') newPos.x -= 1;
      if (direction === 'RIGHT') newPos.x += 1;

      if (newPos.x < 0 || newPos.x >= MAP_WIDTH || newPos.y < 0 || newPos.y >= MAP_HEIGHT) {
        return currentPos;
      }
      if (map[newPos.y][newPos.x] === 1) {
        return currentPos;
      }
      return newPos;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          if (map[y][x] === 1) {
            // Mur (1)
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#34495e';
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          } else {
            // Case vide (0)
            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#3a3a4a';
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // Dessin du Joueur (🔴)
      const px = playerPos.x * TILE_SIZE + TILE_SIZE / 2;
      const py = playerPos.y * TILE_SIZE + TILE_SIZE / 2;
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(px, py, TILE_SIZE / 2 - 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    document.addEventListener('keydown', (e) => {
      const directionMap = {
        'ArrowUp': 'UP',
        'ArrowDown': 'DOWN',
        'ArrowLeft': 'LEFT',
        'ArrowRight': 'RIGHT'
      };

      if (directionMap[e.key]) {
        e.preventDefault();
        playerPos = movePlayer(playerPos, directionMap[e.key]);
        render();
      }
    });

    document.getElementById('btn-jouer').addEventListener('click', () => {
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      render();
    });

    document.getElementById('btn-retour').addEventListener('click', () => {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
    });

    document.getElementById('btn-quitter').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
