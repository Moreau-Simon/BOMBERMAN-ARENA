<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bomberman Arena</title>
  <style>
    body { margin: 0; padding: 24px; background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; }
    #app { max-width: 800px; margin: 0 auto; }
    #game-screen { display: none; }
    button { margin: 8px; padding: 12px 24px; border: 0; border-radius: 4px; cursor: pointer; font-size: 16px; }
    #play-button { background-color: #27ae60; color: white; }
    #quit-button { background-color: #c0392b; color: white; }
    canvas { display: block; width: 100%; max-width: 800px; margin: 24px auto; background-color: #34495e; border: 2px solid #ecf0f1; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Bomberman Arena</h1>
    <p id="status">Application prête.</p>
    <div id="menu-screen">
      <button id="play-button" type="button">Jouer</button>
    </div>
    <div id="game-screen">
      <p>Écran de test lancé.</p>
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <button id="quit-button" type="button">Quitter</button>
    </div>
  </div>
  <script>
    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');
    const status = document.getElementById('status');
    const playButton = document.getElementById('play-button');
    const quitButton = document.getElementById('quit-button');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    playButton.addEventListener('click', () => {
      menuScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      status.textContent = 'Partie de test en cours.';
      ctx.fillStyle = '#ecf0f1';
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Jeu lancé', canvas.width / 2, canvas.height / 2);
    });

    quitButton.addEventListener('click', () => {
      gameScreen.style.display = 'none';
      menuScreen.style.display = 'block';
      status.textContent = 'Application prête.';
    });
  </script>
</body>
</html>
