<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bomberman Arena</title>
  <style>
    body { margin: 0; padding: 0; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background-color: #34495e; border: 2px solid #ecf0f1; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div id="app">
    <h1>Bomberman (Client)</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '30px Arial';
    ctx.fillText('Client WebSockets et Rendu prêts.', 150, 300);
  </script>
</body>
</html>
